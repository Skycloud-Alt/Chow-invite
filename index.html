<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>For you ❤️</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    min-height:100vh;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    font-family:'Segoe UI',sans-serif;
    background:linear-gradient(135deg,#ff9a9e,#fad0c4);
    text-align:center;
    padding:20px;
  }
  h1 { font-size:2rem; margin-bottom:10px; color:#333; }
  #phrase { font-size:1.3rem; color:#555; min-height:2em; margin-bottom:40px; }
  #btn {
    padding:16px 48px;
    font-size:1.2rem;
    border:none;
    border-radius:50px;
    background:#e74c3c;
    color:#fff;
    cursor:pointer;
    transition:transform .1s;
    position:relative;
  }
  #btn:hover { transform:scale(1.05); }
  #result {
    display:none;
    font-size:1.5rem;
    margin-top:30px;
    color:#2c3e50;
  }
  .confetti {
    position:fixed;
    width:10px;height:10px;
    top:-10px;
    animation:fall linear forwards;
  }
  @keyframes fall {
    to { transform:translateY(110vh) rotate(720deg); }
  }
</style>
</head>
<body>

<h1>🥩 Sam-G anyone?</h1>
<p id="phrase">Click "Yes" when you're ready…</p>
<button id="btn">Yes!</button>
<p id="result">🔥 LET'S GOOO! 🥩🔥</p>   

<script>
const phrases = [
  "Click \"Yes\" when you're ready…",
  "The button is shy? It dodges! 😄",
  "Try again… it won't bite!",
  "Almost! Just a little more…",
  "You can't escape 😉",
  "You know it only works with YES",
  "Give up and click YES 🙈",
  "Last try… (kidding, keep going!)"
];
let i = 0;
const btn = document.getElementById('btn');
const phraseEl = document.getElementById('phrase');
const result = document.getElementById('result');

function dodge(e) {
  e.preventDefault();
  const x = Math.random() * (window.innerWidth - 150);
  const y = Math.random() * (window.innerHeight - 80);
  btn.style.position = 'fixed';
  btn.style.left = x + 'px';
  btn.style.top  = y + 'px';
  i = (i + 1) % phrases.length;
  phraseEl.textContent = phrases[i];
}

btn.addEventListener('mouseover', dodge);
btn.addEventListener('touchstart', dodge, { passive: false });

btn.addEventListener('click', function() {
  btn.style.display = 'none';
  result.style.display = 'block';
  for (let j = 0; j < 60; j++) {
    const c = document.createElement('div');
    c.className = 'confetti';
    c.style.left = Math.random() * 100 + 'vw';
    c.style.background = `hsl(${Math.random()*360},80%,60%)`;
    c.style.animationDuration = (2 + Math.random()*3) + 's';
    document.body.appendChild(c);
  }
});
</script>
</body>
</html>
