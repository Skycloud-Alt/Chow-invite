<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>For you ❤️</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    min-height:100vh;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    font-family:'Segoe UI',sans-serif;
    background:linear-gradient(135deg,#ff9a9e,#fad0c4);
    text-align:center;
    padding:20px;
    transition:background 0.5s;
  }
  body.party {
    background:linear-gradient(135deg,#f093fb,#f5576c,#4facfe,#00f2fe);
    background-size:400% 400%;
    animation:gradient 3s ease infinite;
  }
  @keyframes gradient {
    0% { background-position:0% 50%; }
    50% { background-position:100% 50%; }
    100% { background-position:0% 50%; }
  }
  h1 { font-size:2rem; margin-bottom:10px; color:#333; }
  #phrase { font-size:1.3rem; color:#555; min-height:2em; margin-bottom:40px; }
  .btn-row { display:flex; gap:20px; justify-content:center; }
  #yes {
    padding:16px 48px;
    font-size:1.2rem;
    border:none;
    border-radius:50px;
    background:#27ae60;
    color:#fff;
    cursor:pointer;
    transition:transform .1s;
  }
  #yes:hover { transform:scale(1.1); }
  #no {
    padding:16px 48px;
    font-size:1.2rem;
    border:none;
    border-radius:50px;
    background:#e74c3c;
    color:#fff;
    cursor:pointer;
    transition:transform .1s;
    position:relative;
  }
  #no:hover { transform:scale(1.05); }
  #result {
    display:none;
    margin-top:30px;
  }
  #big-yes {
    font-size:4rem;
    font-weight:900;
    color:#fff;
    text-shadow:0 0 20px rgba(0,0,0,0.3);
    animation:pop 0.5s cubic-bezier(0.68,-0.55,0.265,1.55);
  }
  @keyframes pop {
    0% { transform:scale(0); }
    100% { transform:scale(1); }
  }
  #sub-yes {
    font-size:1.8rem;
    color:#fff;
    margin-top:10px;
    animation:bounce 1s infinite;
  }
  @keyframes bounce {
    0%,100% { transform:translateY(0); }
    50% { transform:translateY(-15px); }
  }
  .confetti {
    position:fixed;
    width:12px;height:12px;
    top:-12px;
    animation:fall linear forwards;
    z-index:100;
  }
  @keyframes fall {
    to { transform:translateY(110vh) rotate(1080deg); }
  }
  .emoji-burst {
    position:fixed;
    font-size:2.5rem;
    animation:burst 1.5s ease-out forwards;
    z-index:100;
  }
  @keyframes burst {
    0% { transform:scale(0) rotate(0deg); opacity:1; }
    50% { transform:scale(1.5) rotate(180deg); opacity:1; }
    100% { transform:scale(0.5) rotate(360deg); opacity:0; }
  }
</style>
</head>
<body>

<h1>🥩 Sam-G anyone?</h1>
<p id="phrase">Choose wisely…</p>
<div class="btn-row">
  <button id="yes">Yes!</button>
  <button id="no">No</button>
</div>
<div id="result">
  <div id="big-yes">YES!!!</div>
  <div id="sub-yes">🔥 LET'S GOOO! 🥩🔥</div>
</div>

<script>
const phrases = [
  "Choose wisely…",
  "The button is shy? It dodges! 😄",
  "You can't skip the pork 😉",
  "No escaping samgyeopsal!",
  "Just click YES already 🙈",
  "Your stomach already said yes",
  "Last try… (kidding, keep going!)",
  "Bro. Say yes.",
  "I'm not even mad, I'm impressed you keep trying",
  "The button has lawyers now 📋",
  "You've been chasing that button for 10 seconds…",
  "Meanwhile the samgyeopsal is getting cold 🥲",
  "Okay fine, I'll wait. Forever.",
  "This is your final warning ⚠️",
  "I'm telling your mom you said no",
  "The button called its therapist",
  "You know what? I respect the hustle",
  "Giving up is also an option… (no it isn't)",
  "🥩🥩🥩🥩🥩🥩🥩🥩🥩🥩",
  "Okay I'm leaving. Bye."
];
let i = 0;
const noBtn = document.getElementById('no');
const yesBtn = document.getElementById('yes');
const phraseEl = document.getElementById('phrase');
const result = document.getElementById('result');

function dodge(e) {
  e.preventDefault();
  const x = Math.random() * (window.innerWidth - 150);
  const y = Math.random() * (window.innerHeight - 80);
  noBtn.style.position = 'fixed';
  noBtn.style.left = x + 'px';
  noBtn.style.top  = y + 'px';
  i = (i + 1) % phrases.length;
  phraseEl.textContent = phrases[i];
  const s = Math.max(0.3, 1 - i * 0.05);
  noBtn.style.transform = `scale(${s})`;
}

noBtn.addEventListener('mouseover', dodge);
noBtn.addEventListener('touchstart', dodge, { passive: false });

yesBtn.addEventListener('click', function() {
  noBtn.style.display = 'none';
  yesBtn.style.display = 'none';
  phraseEl.style.display = 'none';
  document.querySelector('h1').style.display = 'none';
  result.style.display = 'block';
  document.body.classList.add('party');

  // Wave 1: big confetti burst
  for (let j = 0; j < 120; j++) {
    setTimeout(() => {
      const c = document.createElement('div');
      c.className = 'confetti';
      c.style.left = Math.random() * 100 + 'vw';
      c.style.background = `hsl(${Math.random()*360},90%,60%)`;
      c.style.animationDuration = (2 + Math.random()*3) + 's';
      c.style.borderRadius = Math.random() > 0.5 ? '50%' : '0';
      document.body.appendChild(c);
    }, j * 30);
  }

  // Wave 2: emoji burst
  const emojis = ['🥩','🔥','🎉','🥳','✨','💪','🍖','🧀'];
  for (let k = 0; k < 15; k++) {
    setTimeout(() => {
      const em = document.createElement('div');
      em.className = 'emoji-burst';
      em.textContent = emojis[Math.floor(Math.random() * emojis.length)];
      em.style.left = Math.random() * 80 + 10 + 'vw';
      em.style.top = Math.random() * 60 + 20 + 'vh';
      document.body.appendChild(em);
      setTimeout(() => em.remove(), 1500);
    }, k * 200);
  }

  // Wave 3: second confetti rain after 2s
  setTimeout(() => {
    for (let j = 0; j < 80; j++) {
      const c = document.createElement('div');
      c.className = 'confetti';
      c.style.left = Math.random() * 100 + 'vw';
      c.style.background = `hsl(${Math.random()*360},90%,60%)`;
      c.style.animationDuration = (2 + Math.random()*3) + 's';
      c.style.borderRadius = Math.random() > 0.5 ? '50%' : '0';
      document.body.appendChild(c);
    }
  }, 2000);
});
</script>
</body>
</html>
